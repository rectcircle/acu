name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      ACU_MACOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Extract release notes
        run: |
          mkdir -p build
          ./scripts/extract-release-notes.sh "$GITHUB_REF_NAME" \
            > build/release-notes.md

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Package universal app
        env:
          ACU_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Verify release app
        run: |
          codesign --verify --deep --strict build/ACU.app
          plist_minos=$(
            /usr/libexec/PlistBuddy \
              -c "Print :LSMinimumSystemVersion" \
              build/ACU.app/Contents/Info.plist
          )
          if [ "$plist_minos" != "$ACU_MACOS_DEPLOYMENT_TARGET" ]; then
            echo "::error::Info.plist deployment target is $plist_minos"
            exit 1
          fi
          for arch in arm64 x86_64; do
            lipo -verify_arch "$arch" build/ACU.app/Contents/MacOS/acu
            minos=$(
              otool -arch "$arch" -l build/ACU.app/Contents/MacOS/acu |
                awk '/minos/{print $2; exit}'
            )
            if [ "$minos" != "$ACU_MACOS_DEPLOYMENT_TARGET" ]; then
              echo "::error::$arch deployment target is $minos"
              exit 1
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/ACU.tar.gz \
            build/ACU.tar.gz.sha256 \
            --notes-file build/release-notes.md \
            --verify-tag
