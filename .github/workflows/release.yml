name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      ACU_MACOS_DEPLOYMENT_TARGET: "15.0"
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-go@v6
        with:
          cache: false
          go-version: "1.22.x"

      - name: Extract release notes
        run: |
          mkdir -p build
          ./scripts/extract-release-notes.sh "$RELEASE_TAG" \
            > build/release-notes.md

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: Package universal app
        env:
          ACU_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh "$RELEASE_TAG"

      - name: Verify release app
        run: |
          codesign --verify --deep --strict build/ACU.app
          plist_minos=$(
            /usr/libexec/PlistBuddy \
              -c "Print :LSMinimumSystemVersion" \
              build/ACU.app/Contents/Info.plist
          )
          if [ "$plist_minos" != "$ACU_MACOS_DEPLOYMENT_TARGET" ]; then
            echo "::error::Info.plist deployment target is $plist_minos"
            exit 1
          fi
          for arch in arm64 x86_64; do
            lipo build/ACU.app/Contents/MacOS/acu -verify_arch "$arch"
            minos=$(
              otool -arch "$arch" -l build/ACU.app/Contents/MacOS/acu |
                awk '/minos/{print $2; exit}'
            )
            if [ "$minos" != "$ACU_MACOS_DEPLOYMENT_TARGET" ]; then
              echo "::error::$arch deployment target is $minos"
              exit 1
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              build/ACU.tar.gz \
              build/ACU.tar.gz.sha256 \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "ACU $RELEASE_TAG" \
              --notes-file build/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              build/ACU.tar.gz \
              build/ACU.tar.gz.sha256 \
              --title "ACU $RELEASE_TAG" \
              --notes-file build/release-notes.md \
              --verify-tag
          fi

      - name: Update Homebrew cask
        run: |
          sha256=$(awk 'NR == 1 { print $1 }' build/ACU.tar.gz.sha256)
          git fetch origin main
          git checkout -B homebrew-update origin/main
          ./scripts/update-cask.sh "$RELEASE_TAG" "$sha256"
          git add Casks/acu.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "chore(homebrew): update acu to ${RELEASE_TAG#v}"
          git push origin HEAD:main
