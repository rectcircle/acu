name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Publish only after the user explicitly authorizes the reviewed draft (for example v0.1.5)
        required: true
        type: string

permissions:
  contents: write

# Serialize builds and publication so assets and Cask updates cannot race.
concurrency:
  group: acu-release
  cancel-in-progress: false

jobs:
  build-draft:
    if: github.event_name == 'push'
    runs-on: macos-15
    env:
      ACU_MACOS_DEPLOYMENT_TARGET: "15.0"
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-go@v6
        with:
          cache: false
          go-version: "1.22.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refuse to overwrite a public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already public; use a new version tag."
              exit 1
            fi
          fi

      - name: Extract release notes
        env:
          QUARK_SHARE_URL: ${{ vars.QUARK_SHARE_URL }}
          QUARK_SHARE_CODE: ${{ vars.QUARK_SHARE_CODE }}
        run: |
          mkdir -p build
          ./scripts/extract-release-notes.sh "$RELEASE_TAG" \
            > build/release-notes.md
          if [ -n "$QUARK_SHARE_URL" ]; then
            printf '\n国内下载 / China mirror: %s\n提取码 / Code: %s\n' \
              "$QUARK_SHARE_URL" "$QUARK_SHARE_CODE" >> build/release-notes.md
            printf '正式发布后同步；镜像失败时请使用 GitHub 下载。 / Synced after publication; use GitHub if mirroring fails.\n' >> build/release-notes.md
          fi

      - name: Test
        run: |
          go test ./...
          go vet ./...
          python3 -m unittest discover -s scripts/tests

      - name: Package universal app
        env:
          ACU_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh "$RELEASE_TAG"

      - name: Verify release app
        run: |
          codesign --verify --deep --strict build/ACU.app
          plist_minos=$(
            /usr/libexec/PlistBuddy \
              -c "Print :LSMinimumSystemVersion" \
              build/ACU.app/Contents/Info.plist
          )
          if [ "$plist_minos" != "$ACU_MACOS_DEPLOYMENT_TARGET" ]; then
            echo "::error::Info.plist deployment target is $plist_minos"
            exit 1
          fi
          for arch in arm64 x86_64; do
            lipo build/ACU.app/Contents/MacOS/acu -verify_arch "$arch"
            minos=$(
              otool -arch "$arch" -l build/ACU.app/Contents/MacOS/acu |
                awk '/minos/{print $2; exit}'
            )
            if [ "$minos" != "$ACU_MACOS_DEPLOYMENT_TARGET" ]; then
              echo "::error::$arch deployment target is $minos"
              exit 1
            fi
          done

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_base="ACU-${RELEASE_TAG#v}-macos-universal"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Refusing to replace assets of a public release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" \
              "build/$artifact_base.tar.gz" \
              "build/$artifact_base.tar.gz.sha256" \
              "build/$artifact_base.dmg" \
              "build/$artifact_base.dmg.sha256" \
              --clobber
            # Remove the obsolete installer when replacing an existing draft.
            for legacy_asset in "$artifact_base.pkg" "$artifact_base.pkg.sha256"; do
              if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' |
                grep -Fxq "$legacy_asset"; then
                gh release delete-asset "$RELEASE_TAG" "$legacy_asset" --yes
              fi
            done
            gh release edit "$RELEASE_TAG" \
              --title "ACU $RELEASE_TAG" \
              --notes-file build/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              "build/$artifact_base.tar.gz" \
              "build/$artifact_base.tar.gz.sha256" \
              "build/$artifact_base.dmg" \
              "build/$artifact_base.dmg.sha256" \
              --title "ACU $RELEASE_TAG" \
              --notes-file build/release-notes.md \
              --draft \
              --latest=false \
              --verify-tag
          fi

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and verify the reviewed release assets
        run: |
          python3 scripts/quark-release.py verify "$RELEASE_TAG" --draft --output build

      - name: Publish the reviewed release
        run: |
          git fetch origin main
          git checkout -B homebrew-update origin/main
          current_version=$(awk '/^  version / { gsub(/"/, "", $2); print $2 }' Casks/acu.rb)
          comparison=$(python3 scripts/compare-versions.py "$RELEASE_TAG" "$current_version")
          latest=true
          if [ "$comparison" = "-1" ]; then
            latest=false
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"

  mirror-quark:
    needs: publish
    uses: ./.github/workflows/mirror-quark.yml
    with:
      tag: ${{ inputs.version }}
    secrets:
      QUARK_AUTH: ${{ secrets.QUARK_AUTH }}

  update-cask:
    needs: publish
    uses: ./.github/workflows/update-cask.yml
    with:
      tag: ${{ inputs.version }}
