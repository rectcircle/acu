name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Publish only after the user explicitly authorizes the reviewed draft (for example v0.1.5)
        required: true
        type: string

permissions:
  contents: write

# Serialize builds and publication so assets and Cask updates cannot race.
concurrency:
  group: acu-release
  cancel-in-progress: false

jobs:
  build-draft:
    if: github.event_name == 'push'
    runs-on: macos-15
    env:
      ACU_MACOS_DEPLOYMENT_TARGET: "15.0"
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-go@v6
        with:
          cache: false
          go-version: "1.22.x"

      - name: Refuse to overwrite a public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already public; use a new version tag."
              exit 1
            fi
          fi

      - name: Extract release notes
        run: |
          mkdir -p build
          ./scripts/extract-release-notes.sh "$RELEASE_TAG" \
            > build/release-notes.md

      - name: Test
        run: |
          go test ./...
          go vet ./...
          python3 -m unittest discover -s scripts/tests

      - name: Package universal app
        env:
          ACU_BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package-release.sh "$RELEASE_TAG"

      - name: Verify release app
        run: |
          codesign --verify --deep --strict build/ACU.app
          plist_minos=$(
            /usr/libexec/PlistBuddy \
              -c "Print :LSMinimumSystemVersion" \
              build/ACU.app/Contents/Info.plist
          )
          if [ "$plist_minos" != "$ACU_MACOS_DEPLOYMENT_TARGET" ]; then
            echo "::error::Info.plist deployment target is $plist_minos"
            exit 1
          fi
          for arch in arm64 x86_64; do
            lipo build/ACU.app/Contents/MacOS/acu -verify_arch "$arch"
            minos=$(
              otool -arch "$arch" -l build/ACU.app/Contents/MacOS/acu |
                awk '/minos/{print $2; exit}'
            )
            if [ "$minos" != "$ACU_MACOS_DEPLOYMENT_TARGET" ]; then
              echo "::error::$arch deployment target is $minos"
              exit 1
            fi
          done

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_base="ACU-${RELEASE_TAG#v}-macos-universal"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$is_draft" != "true" ]; then
              echo "::error::Refusing to replace assets of a public release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" \
              "build/$artifact_base.tar.gz" \
              "build/$artifact_base.tar.gz.sha256" \
              "build/$artifact_base.pkg" \
              "build/$artifact_base.pkg.sha256" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "ACU $RELEASE_TAG" \
              --notes-file build/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              "build/$artifact_base.tar.gz" \
              "build/$artifact_base.tar.gz.sha256" \
              "build/$artifact_base.pkg" \
              "build/$artifact_base.pkg.sha256" \
              --title "ACU $RELEASE_TAG" \
              --notes-file build/release-notes.md \
              --draft \
              --latest=false \
              --verify-tag
          fi

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Download and verify the reviewed release assets
        run: |
          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [ "$is_draft" != "true" ]; then
            echo "::error::Only a reviewed draft release can be published."
            exit 1
          fi
          artifact_base="ACU-${RELEASE_TAG#v}-macos-universal"
          gh release download "$RELEASE_TAG" --dir build \
            --pattern "$artifact_base.tar.gz" \
            --pattern "$artifact_base.tar.gz.sha256" \
            --pattern "$artifact_base.pkg" \
            --pattern "$artifact_base.pkg.sha256"
          for artifact in "$artifact_base.tar.gz" "$artifact_base.pkg"; do
            expected_sha=$(awk 'NR == 1 { print $1 }' "build/$artifact.sha256")
            actual_sha=$(sha256sum "build/$artifact" | awk '{ print $1 }')
            if [ "$expected_sha" != "$actual_sha" ]; then
              echo "::error::$artifact checksum mismatch."
              exit 1
            fi
          done

      - name: Publish the release and update Homebrew cask
        run: |
          archive="ACU-${RELEASE_TAG#v}-macos-universal.tar.gz"
          sha256=$(awk 'NR == 1 { print $1 }' "build/$archive.sha256")
          git fetch origin main
          git checkout -B homebrew-update origin/main
          current_version=$(awk '/^  version / { gsub(/"/, "", $2); print $2 }' Casks/acu.rb)
          comparison=$(python3 scripts/compare-versions.py "$RELEASE_TAG" "$current_version")
          latest=true
          if [ "$comparison" = "-1" ]; then
            latest=false
          fi
          ./scripts/update-cask.sh "$RELEASE_TAG" "$sha256"
          # Retries also repair the Cask if publication succeeded but pushing failed.
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
          git add Casks/acu.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "chore(homebrew): update acu to ${RELEASE_TAG#v}"
          git push origin HEAD:main
